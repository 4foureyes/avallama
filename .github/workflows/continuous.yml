name: Continuous Test and Package Build

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 18 * * 5' # Every Friday at 18:30 UTC

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    permissions:
      contents: read
      id-token: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Display dotnet info
        run: dotnet --info

      - name: Restore
        run: dotnet restore avallama.slnx

      - name: Build
        run: dotnet build avallama.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test avallama.slnx
          --configuration Release
          --no-build
          --settings avallama.Tests/runsettings.runsettings
          --logger "console;verbosity=detailed"
          -v n

  build-windows:
    name: (Release Test) Build Windows Installer
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Restore & Publish
        run: dotnet publish avallama/avallama.csproj -c Release -r win-x64 --self-contained true -o win-dist

      - name: Remove debug symbol files from installer payload
        shell: pwsh
        run: |
          Get-ChildItem win-dist -Recurse -Include *.pdb,*.dbg -File | Remove-Item -Force
          Get-ChildItem win-dist -Recurse -Directory -Filter *.dSYM | Remove-Item -Recurse -Force

      - name: Install Inno Setup
        run: |
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile is.exe
          Start-Process -FilePath .\is.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Build Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            scripts\installer.iss

  build-debian:
    name: (Release Test) Build Debian Package
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Run Debian packaging script
        run: |
          chmod +x scripts/package-debian.sh
          ./scripts/package-debian.sh

  build-arch:
    name: (Release Test) Build Arch Package
    needs: test
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install base build tools and .NET
        run: |
          pacman -Syu --noconfirm
          pacman -Sy --noconfirm base-devel git curl unzip icu dotnet-sdk dotnet-runtime fontconfig freetype2 libx11 libxrender libxcb mesa libpng zlib
          dotnet --version

      - name: Checkout source
        uses: actions/checkout@v6

      - name: Run Arch packaging script
        run: |
          useradd -m builder
          mkdir -p /tmp/build
          cp -r avallama /tmp/build/
          cp -r scripts /tmp/build/
          chown -R builder:builder /tmp/build
          sudo -u builder bash -c "cd /tmp/build && chmod +x scripts/package-arch.sh && scripts/package-arch.sh"


  build-macos:
    name: (Release Test) Build macOS Packages
    needs: test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Install create-dmg tool
        run: brew install create-dmg

      - name: Run macOS packaging script
        run: |
          chmod +x scripts/package-macos.sh
          ./scripts/package-macos.sh
